<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>TimerGame</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" aria-live="polite"><section id="start" class="screen"><h1>Поставить таймер на 4 минуты?</h1><button id="startBtn" type="button">Начать</button><p class="hint">Нажми кнопку или Enter</p><p id="status" class="status"></p></section><section id="play" class="screen hidden" aria-label="Игра"><img id="photo" alt="Случайная фотография" class="hidden"><div id="audioView" class="hidden"><p>♫</p><div id="countdown" aria-live="off"></div></div><button id="exitBtn" class="exit" type="button">Выйти</button></section><section id="end" class="screen hidden"><h1>ВСЁ, ХВАТИТ!</h1><button id="againBtn" type="button">Заново</button></section></main><script src="app.js" defer></script></body></html>
